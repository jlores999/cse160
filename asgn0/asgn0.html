<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>asgn0 (canvas version)</title>
  </head>

  <body onload="main()">
    <script src="lib/cuon-matrix-cse160.js"></script>
    <canvas id="example" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>
    <script src="asgn0.js"></script>
    <br>
    <label for="x1"> v1:x1</label>
    <input
      type="text"
      id = "x1"
      name="x1"
      />
    <label for="y1"> y1</label>
    <input
      type="text"
      id = "y1"
      name="y1"
      />
    <br>
    <label for="x2"> v2:x2</label>  
    <input
      type="text"
      id = "x2"
      name="x2"
      />
    <label for="y2"> y2</label>
    <input
      type="text"
      id = "y2"
      name="y2"
      />
    <input
      type="button"
      value="Draw Vector"
      onclick="handleDraw()"/>
    <br>
    <label for="op-select"> Select an operation:</label>
    <select name="op-select" id="op-select">
      <option value="">--Please choose an operation--</option>
      <option value="+">Add</option>
      <option value="-">Sub</option>
      <option value="*">Mul</option>
      <option value="/">Div</option>
      <option value="mag">Magnitude</option>
      <option value="norm">Normalize</option>
      <option value="angle">Angle Between</option>
      <option value="area">Area</option>
    </select>
    <label for="scalar"> Scalar:</label>
    <input
      type="text"
      id="scalar"
      name="scalar"
      />
    <input
      type="button"
      value="Draw Vector"
      onclick="handleDrawOperationEvent()"/>
  </body>
</html>
