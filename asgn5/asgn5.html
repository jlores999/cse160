<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
  }
}
  </script>
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loading .progress {
        margin: 1.5em;
        border: 1px solid white;
        width: 50vw;
    }
    #loading .progressbar {
        margin: 2px;
        background: white;
        height: 1em;
        transform-origin: top left;
        transform: scaleX(0);
    }
  </style>

<script type="module">
  import * as THREE from 'three' 
  import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

function main() {
  const canvas = document.querySelector('#c');
  const renderer = new THREE.WebGLRenderer({antialias: true, canvas});
  const fov = 75;
  const aspect = 2;  // the canvas default
  const near = 0.1;
  const far = 5;
  const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
  camera.position.z = 2;
  const scene = new THREE.Scene();
  const boxWidth = 1;
  const boxHeight = 1;
  const boxDepth = 1;
  const color = 0xFFFFFF;
  const intensity = 3;
  const light = new THREE.DirectionalLight(color, intensity);
  let cube;
  light.position.set(-1, 2, 4);
  scene.add(light);
  const geometry = new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);
  //texture
  const loadManager = new THREE.LoadingManager();
  const loader = new THREE.TextureLoader(loadManager);
  const materials = [
    new THREE.MeshBasicMaterial({map: loader.load('images/flower-1.jpg')}),
    new THREE.MeshBasicMaterial({map: loader.load('images/flower-2.jpg')}),
    new THREE.MeshBasicMaterial({map: loader.load('images/flower-3.jpg')}),
    new THREE.MeshBasicMaterial({map: loader.load('images/flower-4.jpg')}),
    new THREE.MeshBasicMaterial({map: loader.load('images/flower-5.jpg')}),
    new THREE.MeshBasicMaterial({map: loader.load('images/flower-6.jpg')}),
  ];
  const loadingElem = document.querySelector('#loading');
  const progressBarElem = loadingElem.querySelector('.progressbar');
  loadManager.onLoad = () => {
    loadingElem.style.display = 'none';
    cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);
   // cubes.push(cube);  // add to our list of cubes to rotate
  };

  loadManager.onProgress = (urlOfLastItemLoaded, itemsLoaded, itemsTotal) => {
  const progress = itemsLoaded / itemsTotal;
  progressBarElem.style.transform =  `scaleX(${progress})`;
};


  function loadColorTexture( path ) {
    const texture = loader.load( path );
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }
  renderer.render(scene, camera);
  function render(time) {
      time *= 0.001;  // convert time to seconds
      if (cube){
        cube.rotation.x = time;
        cube.rotation.y = time;
      }
     
      renderer.render(scene, camera);
     
      requestAnimationFrame(render);
    }
  //requestAnimationFrame(render);
  function makeInstance(geometry, color, x) {
    const material = new THREE.MeshPhongMaterial({color});
     
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
     
    cube.position.x = x;
     
    return cube;
  }
    requestAnimationFrame(render);
}

main();

</script>

<body>
  <canvas id="c"></canvas>
    <div id="loading">
    <div class="progress"><div class="progressbar"></div></div>
  </div>
</body>
